<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EcoCar</title>
    <link rel="stylesheet" href="apps.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #a5d6a5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 2rem;
        }
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .dashboard-header h1 {
            color: #1b5e20;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logout-btn {
            background: #ff7043;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background: #f4511e;
        }
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-card i {
            font-size: 2.5rem;
            color: #2e7d32;
            margin-bottom: 0.5rem;
        }
        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #1b5e20;
        }
        .stat-card .stat-label {
            color: #5c6e58;
            font-size: 0.9rem;
        }
        /* Filters */
        .filters {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .filter-btn {
            background: #e8f5e9;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: #2e7d32;
            color: white;
        }
        .filter-btn:hover:not(.active) {
            background: #c8e6c9;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
        }
        .search-box input {
            padding: 8px 16px;
            border: 1px solid #c8e6c9;
            border-radius: 40px;
            outline: none;
            width: 250px;
        }
        .search-box input:focus {
            border-color: #2e7d32;
        }
        .search-box button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
        }
        /* Orders Table */
        .orders-table-wrapper {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            overflow-x: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0f2e0;
        }
        th {
            background: #f1f8e9;
            color: #1b5e20;
            font-weight: 600;
        }
        tr:hover {
            background: #f9fbe7;
        }
        .items-list {
            font-size: 0.85rem;
            margin: 0;
            padding-left: 1rem;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-pending { background: #fff3e0; color: #ff9800; }
        .status-confirmed { background: #e3f2fd; color: #2196f3; }
        .status-shipped { background: #f3e5f5; color: #9c27b0; }
        .status-delivered { background: #e8f5e9; color: #4caf50; }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .update-btn, .delete-btn {
            padding: 5px 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.3s;
        }
        .update-btn {
            background: #2e7d32;
            color: white;
        }
        .update-btn:hover {
            background: #1b5e20;
        }
        .delete-btn {
            background: #d32f2f;
            color: white;
        }
        .delete-btn:hover {
            background: #b71c1c;
        }
        select {
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
        }
        .no-orders {
            text-align: center;
            padding: 3rem;
            color: #666;
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .filters { flex-direction: column; align-items: stretch; }
            .search-box { width: 100%; }
            .search-box input { width: 100%; }
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1><i class="fas fa-chalkboard-user"></i> Admin Dashboard</h1>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <!-- Stats Cards (will be populated by JS) -->
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card"><i class="fas fa-shopping-cart"></i><div class="stat-value" id="total-orders">0</div><div class="stat-label">Total Orders</div></div>
            <div class="stat-card"><i class="fas fa-dollar-sign"></i><div class="stat-value" id="total-revenue">৳0</div><div class="stat-label">Revenue</div></div>
            <div class="stat-card"><i class="fas fa-clock"></i><div class="stat-value" id="pending-orders">0</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><i class="fas fa-check-circle"></i><div class="stat-value" id="delivered-orders">0</div><div class="stat-label">Delivered</div></div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-buttons" id="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="confirmed">Confirmed</button>
                <button class="filter-btn" data-filter="shipped">Shipped</button>
                <button class="filter-btn" data-filter="delivered">Delivered</button>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search by order ID, name or phone...">
                <button id="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="orders-table-wrapper">
            <div id="orders-list">
                <p>Loading orders...</p>
            </div>
        </div>
    </div>

    <script>
        let allOrders = [];
        let currentFilter = 'all';
        let currentSearch = '';

        async function loadOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                if (res.status === 403) {
                    document.getElementById('orders-list').innerHTML = '<div class="no-orders">❌ Access denied. You must be logged in as <strong>admin</strong>.</div>';
                    return;
                }
                if (!res.ok) throw new Error('Failed to load orders');
                allOrders = await res.json();
                updateStats();
                renderOrders();
            } catch (err) {
                document.getElementById('orders-list').innerHTML = '<div class="no-orders">⚠️ Error loading orders.</div>';
                console.error(err);
            }
        }

        function updateStats() {
            const total = allOrders.length;
            const revenue = allOrders.reduce((sum, order) => sum + parseFloat(order.total), 0).toFixed(2);
            const pending = allOrders.filter(o => o.status === 'pending').length;
            const delivered = allOrders.filter(o => o.status === 'delivered').length;
            document.getElementById('total-orders').innerText = total;
            document.getElementById('total-revenue').innerText = `৳${revenue}`;
            document.getElementById('pending-orders').innerText = pending;
            document.getElementById('delivered-orders').innerText = delivered;
        }

        function renderOrders() {
            let filtered = allOrders;
            if (currentFilter !== 'all') {
                filtered = filtered.filter(order => order.status === currentFilter);
            }
            if (currentSearch.trim() !== '') {
                const searchTerm = currentSearch.toLowerCase();
                filtered = filtered.filter(order => 
                    order.id.toString().includes(searchTerm) ||
                    order.fullName.toLowerCase().includes(searchTerm) ||
                    order.phone.includes(searchTerm)
                );
            }
            if (filtered.length === 0) {
                document.getElementById('orders-list').innerHTML = '<div class="no-orders">📭 No orders match your criteria.</div>';
                return;
            }
            let html = ` <table>
                <thead>
                    <tr><th>ID</th><th>User</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th><th>Date</th></tr>
                </thead>
                <tbody>`;
            filtered.forEach(order => {
                let itemsHtml = '<ul class="items-list">';
                order.items.forEach(item => {
                    itemsHtml += `<li>${escapeHtml(item.name)} x ${item.quantity} = ৳${(item.price * item.quantity).toFixed(2)}</li>`;
                });
                itemsHtml += '</ul>';
                html += `<tr>
                    <td>${order.id}</td>
                    <td>${escapeHtml(order.username)}</td>
                    <td>${escapeHtml(order.fullName)}</td>
                    <td>${escapeHtml(order.phone)}</td>
                    <td>${escapeHtml(order.address)}</td>
                    <td>${itemsHtml}</td>
                    <td><strong>৳${parseFloat(order.total).toFixed(2)}</strong></td>
                    <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                    <td class="action-buttons">
                        <select id="status-${order.id}">
                            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                        </select>
                        <button class="update-btn" onclick="updateStatus(${order.id})">Update</button>
                        <button class="delete-btn" onclick="deleteOrder(${order.id})">Delete</button>
                    </td>
                    <td>${new Date(order.order_date).toLocaleString()}</td>
                </tr>`;
            });
            html += '</tbody> </table>';
            document.getElementById('orders-list').innerHTML = html;
        }

        async function updateStatus(orderId) {
            const select = document.getElementById(`status-${orderId}`);
            const newStatus = select.value;
            try {
                const res = await fetch(`/api/admin/order/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message);
                loadOrders();
            } catch (err) {
                alert('Error updating status: ' + err.message);
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('Delete this order permanently? This cannot be undone.')) return;
            try {
                const res = await fetch(`/api/admin/order/${orderId}`, { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert(data.message);
                loadOrders();
            } catch (err) {
                alert('Error deleting order: ' + err.message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        // Setup filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderOrders();
            });
        });
        document.getElementById('search-btn').addEventListener('click', () => {
            currentSearch = document.getElementById('search-input').value;
            renderOrders();
        });
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                currentSearch = e.target.value;
                renderOrders();
            }
        });

        loadOrders();
    </script>
</body>
</html>
