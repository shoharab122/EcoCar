<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCar - Luxury Perfumes</title>
    <link rel="stylesheet" href="apps.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-leaf"></i>
                <h1>EcoCar Perfumes</h1>
            </div>
            <div class="nav-links" id="nav-links" style="display: none;">
                <a href="#products">Products</a>
                <a href="cart.html">
                    <i class="fas fa-shopping-cart"></i>
                    Cart <span id="cart-count" class="cart-count">0</span>
                </a>
            </div>
            <div class="nav-user" id="nav-user">
                <div id="user-avatar" class="user-avatar" style="display: none;"></div>
                <div id="user-info"></div>
                <button id="change-avatar-btn" class="btn-icon" style="display: none;" title="Change Avatar">
                    <i class="fas fa-camera"></i>
                </button>
                <button id="logout-btn" class="btn-logout" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Auth Section -->
        <section id="auth" class="section auth-section">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="showTab('login')">Login</button>
                    <button class="auth-tab" onclick="showTab('register')">Register</button>
                </div>
                <form id="login-form" class="auth-form active">
                    <h3>Welcome Back!</h3>
                    <div class="form-group">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <form id="register-form" class="auth-form">
                    <h3>Create Account</h3>
                    <div class="form-group">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="Username" required>
                    </div>
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Password (min. 6 characters)" required>
                    </div>
                    <button type="submit" class="btn-primary">Register</button>
                </form>
            </div>
        </section>

        <!-- Products Section (hidden until login) -->
        <section id="products" class="section" style="display: none;">
            <h2 class="section-title">Our Luxury Perfumes</h2>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for perfumes...">
                <button id="search-btn" class="btn-search">
                    <i class="fas fa-search"></i> Search
                </button>
                <button id="clear-search-btn" class="btn-clear-search" style="display: none;">
                    <i class="fas fa-times"></i> Clear
                </button>
            </div>
            
            <div id="products-container" class="products-grid"></div>
        </section>
    </div>

    <!-- Avatar Modal -->
    <div id="avatar-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Choose your avatar</h3>
            <div class="avatar-grid" id="avatar-grid"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Product Detail Modal -->
    <div id="product-modal" class="product-modal">
        <div class="product-modal-content">
            <span class="product-modal-close">&times;</span>
            <div class="product-modal-body">
                <img id="modal-product-img" src="" alt="">
                <div class="product-modal-info">
                    <h2 id="modal-product-name"></h2>
                    <p id="modal-product-description"></p>
                    <div class="modal-price" id="modal-product-price"></div>
                    <div class="modal-actions">
                        <button id="modal-add-to-cart" class="btn-primary">Add to Cart</button>
                        <button id="modal-order-now" class="btn-checkout">Order Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3><i class="fas fa-leaf"></i> EcoCar</h3>
                    <p>Luxury perfumes for your beloved Car</p>
                </div>
                <div class="footer-section">
                    <h4>Contact</h4>
                    <p><i class="fas fa-envelope"></i>nawalnawshin71@gmail.com </p>
                    <p><i class="fas fa-phone"></i> +880 1407-605627</p>
                </div>
                <div class="footer-section">
                    <h4>Legal</h4>
                    <p><a href="#">Privacy Policy</a></p>
                    <p><a href="#">Terms & Conditions</a></p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 EcoCar. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="apps.js"></script>
</body>
</html>
