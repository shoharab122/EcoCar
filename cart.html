<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCar - Your Cart</title>
    <link rel="stylesheet" href="apps.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-leaf"></i>
                <h1>EcoCar Perfumes</h1>
            </div>
            <div class="nav-links" id="nav-links">
                <a href="apps.html">Products</a>
                <a href="cart.html">
                    <i class="fas fa-shopping-cart"></i>
                    Cart <span id="cart-count" class="cart-count">0</span>
                </a>
            </div>
            <div class="nav-user" id="nav-user">
                <div id="user-avatar" class="user-avatar" style="display: none;"></div>
                <div id="user-info"></div>
                <button id="change-avatar-btn" class="btn-icon" style="display: none;" title="Change Avatar">
                    <i class="fas fa-camera"></i>
                </button>
                <button id="logout-btn" class="btn-logout" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="section">
            <h2 class="section-title">Your Shopping Cart</h2>
            <div id="cart-container" class="cart-container"></div>
            <div id="checkout-form-container" style="display: none;">
                <div class="checkout-form">
                    <h3>Shipping Details</h3>
                    <form id="order-form">
                        <div class="form-group">
                            <i class="fas fa-user"></i>
                            <input type="text" name="fullName" placeholder="Full Name" required>
                        </div>
                        <div class="form-group">
                            <i class="fas fa-map-marker-alt"></i>
                            <textarea name="address" placeholder="Shipping Address" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <i class="fas fa-phone"></i>
                            <input type="tel" name="phone" placeholder="Phone Number" required>
                        </div>
                        <button type="submit" class="btn-primary">Place Order</button>
                        <button type="button" class="btn-secondary" onclick="hideCheckoutForm()">Cancel</button>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <div id="toast" class="toast"></div>
    <script src="cart.js"></script>
</body>
</html>
